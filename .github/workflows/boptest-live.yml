name: boptest-live

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boptest-environment-v05
    paths:
      - causalrag/environments/**
      - examples/boptest_live_smoke.py
      - .github/workflows/boptest-live.yml

jobs:
  public-service-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight core
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run against public BOPTEST service
        run: python examples/boptest_live_smoke.py
      - name: Upload external-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boptest-live-result
          path: boptest_live_result.json
          if-no-files-found: warn
