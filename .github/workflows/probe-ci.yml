name: playable-probe-ci

on:
  pull_request:
    paths:
      - 'branchpoint/probe/**'
      - 'branchpoint/interface/probe_api.py'
      - 'branchpoint/templates/**'
      - 'branchpoint/benchmarks/hidden_world.py'
      - 'branchpoint/agent/loop.py'
      - 'branchpoint/agent/runtime.py'
      - 'branchpoint/reasoning/llm.py'
      - 'branchpoint/cli.py'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'Dockerfile'
      - 'render.yaml'
      - 'README.MD'
      - '.env.example'
      - 'tests/test_playable_probe.py'
      - 'tests/test_playable_probe_api.py'
      - 'tests/test_playable_probe_hitl.py'
      - 'tests/test_playable_probe_compare.py'
      - 'tests/test_proposer_audit.py'
      - 'tests/test_probe_access.py'
      - 'tests/test_cli_embedding_options.py'
      - 'tests/test_probe_archive.py'
      - 'tests/test_semantic_replay.py'
      - '.github/workflows/probe-ci.yml'
  push:
    branches: [main]
    paths:
      - 'branchpoint/probe/**'
      - 'branchpoint/interface/probe_api.py'
      - 'branchpoint/templates/**'
      - 'branchpoint/benchmarks/hidden_world.py'
      - 'branchpoint/agent/loop.py'
      - 'branchpoint/agent/runtime.py'
      - 'branchpoint/reasoning/llm.py'
      - 'branchpoint/cli.py'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'Dockerfile'
      - 'render.yaml'
      - 'README.MD'
      - '.env.example'
      - 'tests/test_playable_probe.py'
      - 'tests/test_playable_probe_api.py'
      - 'tests/test_playable_probe_hitl.py'
      - 'tests/test_playable_probe_compare.py'
      - 'tests/test_proposer_audit.py'
      - 'tests/test_probe_access.py'
      - 'tests/test_cli_embedding_options.py'
      - 'tests/test_probe_archive.py'
      - '.github/workflows/probe-ci.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install probe surface
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'
      - name: Compile probe
        run: |
          python -m py_compile branchpoint/probe/archive.py branchpoint/probe/replay.py branchpoint/probe/runtime.py branchpoint/probe/session.py branchpoint/probe/compare.py branchpoint/interface/probe_api.py branchpoint/reasoning/llm.py branchpoint/agent/loop.py
      - name: Run real no-key probe tests
        run: |
          pytest -q tests/test_brand_surface.py tests/test_playable_probe.py tests/test_playable_probe_api.py tests/test_playable_probe_hitl.py tests/test_playable_probe_compare.py tests/test_proposer_audit.py tests/test_probe_access.py tests/test_cli_embedding_options.py tests/test_probe_archive.py tests/test_semantic_replay.py
      - name: Syntax-check live UI JavaScript
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("agent_workbench.html", "playable_probe.html"):
              html = Path("branchpoint/templates", name).read_text(encoding="utf-8")
              script = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
              Path("/tmp/" + name + ".js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/agent_workbench.html.js
          node --check /tmp/playable_probe.html.js
      - name: Build verified Pages replay
        if: matrix.python-version == '3.12'
        run: |
          python scripts/build_pages.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dist/data/runtime.json").read_text(encoding="utf-8"))
          report = data["playable_ab"]
          assert report["vanilla"]["metrics"]
          assert report["causal"]["metrics"]
          assert report["first_divergence"] is not None
          assert report["comparison"]["same_world_inputs"] is True
          print("verified static A/B replay:", report["first_divergence"])
          PY
      - name: Build and smoke-test Playable Probe container
        if: matrix.python-version == '3.12'
        run: |
          docker build -t branchpoint-probe:test .
          docker run -d --rm --name branchpoint-probe-test -p 8765:8765 \
            -e BRANCHPOINT_REQUIRE_PROBE_AUTH=true \
            -e BRANCHPOINT_PROBE_ACCESS_TOKEN=ci-owner-secret \
            -e BRANCHPOINT_PROBE_COOKIE_SECURE=false \
            -e BRANCHPOINT_PROBE_SESSION_DB=/tmp/branchpoint-sessions.sqlite3 \
            branchpoint-probe:test
          trap 'docker logs branchpoint-probe-test || true; docker stop branchpoint-probe-test || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health >/tmp/probe-health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("/tmp/probe-health.json").read_text())
          assert health["status"] == "healthy"
          assert health["surface"] == "playable_probe"
          PY
          curl --fail --silent http://127.0.0.1:8765/ | grep -q "Your agent can propose"
          curl --fail --silent http://127.0.0.1:8765/demo | grep -q "THREE DECISIONS THAT SHOULD NOT LIVE IN PROSE"
          curl --fail --silent http://127.0.0.1:8765/decide | grep -q "Bring one branch point."
          curl --fail --silent http://127.0.0.1:8765/workbench | grep -q "AGENT HISTORY"
          curl --fail --silent http://127.0.0.1:8765/research | grep -q "LIVE WORKBENCH · REAL AGENT CONTROL PLANE"
          test "$(curl --silent --output /tmp/model-test.json --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"provider":"local","model":"test-model"}' \
            http://127.0.0.1:8765/api/model/test)" = "401"
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"hidden_hypothesis":"H2","outcome_mode":"deterministic","proposer_family":"deterministic"}' \
            http://127.0.0.1:8765/api/run >/tmp/public-deterministic.json
          curl --fail --silent \
            -H 'content-type: application/json' \
            -d '{"hidden_hypothesis":"H2","outcome_mode":"deterministic","proposer_family":"deterministic"}' \
            http://127.0.0.1:8765/api/sessions >/tmp/session.json
          python - <<'PY'
          import json
          from pathlib import Path
          session_id = json.loads(Path("/tmp/session.json").read_text())["session_id"]
          Path("/tmp/session-id").write_text(session_id)
          PY
          curl --fail --silent \
            "http://127.0.0.1:8765/api/sessions/$(cat /tmp/session-id)/archive" \
            >/tmp/session-archive.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/session-archive.json").read_text())
          assert payload["session_id"] == Path("/tmp/session-id").read_text()
          assert payload["status"] in {"running", "waiting_for_human", "completed"}
          PY
          curl --fail --silent -c /tmp/probe-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"token":"ci-owner-secret"}' \
            http://127.0.0.1:8765/api/access >/tmp/unlock.json
          curl --fail --silent -b /tmp/probe-cookies.txt \
            http://127.0.0.1:8765/api/access/status | grep -q '"authenticated":true'
          docker stop branchpoint-probe-test
          trap - EXIT
