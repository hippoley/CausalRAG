name: playable-probe-ci

on:
  pull_request:
    paths:
      - 'causalrag/probe/**'
      - 'causalrag/interface/probe_api.py'
      - 'causalrag/templates/playable_probe.html'
      - 'causalrag/benchmarks/hidden_world.py'
      - 'causalrag/agent/loop.py'
      - 'causalrag/agent/runtime.py'
      - 'causalrag/reasoning/llm.py'
      - 'causalrag/cli.py'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'Dockerfile'
      - 'README.MD'
      - '.env.example'
      - 'tests/test_playable_probe.py'
      - 'tests/test_playable_probe_api.py'
      - 'tests/test_playable_probe_hitl.py'
      - 'tests/test_playable_probe_compare.py'
      - 'tests/test_cli_embedding_options.py'
      - '.github/workflows/probe-ci.yml'
  push:
    branches: [main]
    paths:
      - 'causalrag/probe/**'
      - 'causalrag/interface/probe_api.py'
      - 'causalrag/templates/playable_probe.html'
      - 'causalrag/benchmarks/hidden_world.py'
      - 'causalrag/agent/loop.py'
      - 'causalrag/agent/runtime.py'
      - 'causalrag/reasoning/llm.py'
      - 'causalrag/cli.py'
      - 'site/**'
      - 'scripts/build_pages.py'
      - 'Dockerfile'
      - 'README.MD'
      - '.env.example'
      - 'tests/test_playable_probe.py'
      - 'tests/test_playable_probe_api.py'
      - 'tests/test_playable_probe_hitl.py'
      - 'tests/test_playable_probe_compare.py'
      - 'tests/test_cli_embedding_options.py'
      - '.github/workflows/probe-ci.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install probe surface
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'
      - name: Compile probe
        run: |
          python -m py_compile causalrag/probe/runtime.py causalrag/probe/session.py causalrag/probe/compare.py causalrag/interface/probe_api.py
      - name: Run real no-key probe tests
        run: |
          pytest -q tests/test_playable_probe.py tests/test_playable_probe_api.py tests/test_playable_probe_hitl.py tests/test_playable_probe_compare.py tests/test_cli_embedding_options.py
      - name: Build verified Pages replay
        if: matrix.python-version == '3.12'
        run: |
          python scripts/build_pages.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dist/data/runtime.json").read_text(encoding="utf-8"))
          report = data["playable_ab"]
          assert report["vanilla"]["metrics"]
          assert report["causal"]["metrics"]
          assert report["first_divergence"] is not None
          assert report["comparison"]["same_world_inputs"] is True
          print("verified static A/B replay:", report["first_divergence"])
          PY
