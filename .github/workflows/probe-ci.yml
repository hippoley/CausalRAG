name: playable-probe-ci

on:
  pull_request:
    paths:
      - 'causalrag/probe/**'
      - 'causalrag/interface/probe_api.py'
      - 'causalrag/templates/playable_probe.html'
      - 'tests/test_playable_probe.py'
      - 'tests/test_playable_probe_api.py'
      - '.github/workflows/probe-ci.yml'
  push:
    branches: [main]
    paths:
      - 'causalrag/probe/**'
      - 'causalrag/interface/probe_api.py'
      - 'causalrag/templates/playable_probe.html'
      - 'tests/test_playable_probe.py'
      - 'tests/test_playable_probe_api.py'

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install probe surface
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[api,dev]'
      - name: Compile probe
        run: |
          python -m py_compile causalrag/probe/runtime.py causalrag/interface/probe_api.py
      - name: Run real no-key probe tests
        run: |
          pytest -q tests/test_playable_probe.py tests/test_playable_probe_api.py
