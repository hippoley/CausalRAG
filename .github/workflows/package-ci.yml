name: package-ci

on:
  pull_request:
    paths:
      - 'branchpoint/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'README.MD'
      - 'LICENSE'
      - 'tests/test_release_version.py'
      - '.github/workflows/package-ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'tests/test_release_evidence.py'
  push:
    branches: [main]
    paths:
      - 'branchpoint/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'README.MD'
      - 'LICENSE'
      - 'tests/test_release_version.py'
      - '.github/workflows/package-ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'tests/test_release_evidence.py'

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify release wheel surface
        run: python scripts/verify_distribution.py dist

      - name: Install wheel in clean virtualenv
        run: |
          python -m venv /tmp/branchpoint-wheel
          /tmp/branchpoint-wheel/bin/python -m pip install --upgrade pip
          /tmp/branchpoint-wheel/bin/python -m pip install dist/branchpoint-*.whl

      - name: Smoke installed artifact outside repository
        working-directory: /tmp
        run: |
          /tmp/branchpoint-wheel/bin/branchpoint --version
          /tmp/branchpoint-wheel/bin/branchpoint doctor
          /tmp/branchpoint-wheel/bin/python - <<'PY'
          import tempfile
          from pathlib import Path

          import branchpoint
          from branchpoint import (
              AuthorizationContext,
              AuthorizationDenied,
              SQLiteExecutionLedger,
              ToolRegistry,
              ToolSpec,
          )

          assert branchpoint.__version__ == "0.3.0"

          db = Path(tempfile.mkdtemp()) / "effects.sqlite3"
          calls = []
          registry = ToolRegistry(
              [
                  ToolSpec(
                      "effect",
                      "effect",
                      lambda idempotency_key: calls.append(idempotency_key) or {"ok": True},
                      required_permissions=("effect.write",),
                      require_durable_receipt=True,
                      idempotency_key_argument="idempotency_key",
                  )
              ],
              execution_ledger=SQLiteExecutionLedger(db),
          )

          guest = AuthorizationContext.from_permissions("guest", [])
          try:
              registry.execute(
                  "effect",
                  {},
                  effect_id="e-guest",
                  authorization_context=guest,
              )
          except AuthorizationDenied:
              pass
          else:
              raise AssertionError("unauthorized wheel-installed tool call was allowed")

          operator = AuthorizationContext.from_permissions(
              "operator",
              ["effect.write"],
          )
          first = registry.execute(
              "effect",
              {},
              effect_id="e-1",
              authorization_context=operator,
          )
          second = registry.execute(
              "effect",
              {},
              effect_id="e-1",
              authorization_context=operator,
          )
          assert first == second == {"ok": True}
          assert calls == ["e-1"]
          print("installed wheel smoke passed")
          PY

      - name: Build installed-wheel release evidence
        run: |
          mkdir -p evidence
          /tmp/branchpoint-wheel/bin/branchpoint doctor --json > evidence/doctor-${{ matrix.python-version }}.json
          python scripts/build_release_evidence.py \
            --dist-dir dist \
            --doctor evidence/doctor-${{ matrix.python-version }}.json \
            --output evidence/release-evidence-${{ matrix.python-version }}.json

      - name: Upload installed-wheel evidence
        uses: actions/upload-artifact@v4
        with:
          name: branchpoint-release-evidence-py${{ matrix.python-version }}
          path: evidence/*.json
          if-no-files-found: error
