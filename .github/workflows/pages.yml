name: Deploy verified A/B replay

on:
  push:
    branches: [main]
    paths:
      - 'branchpoint/**'
      - 'examples/**'
      - 'site/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: pip install -e '.[dev]'
      - name: Verify browser workbench syntax
        run: node --check site/app.js
      - name: Verify runtime and build static replay
        run: |
          pytest -q tests/test_experiment_contracts.py tests/test_hidden_world_stochastic.py tests/test_playable_probe_compare.py
          python scripts/build_pages.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dist/data/runtime.json").read_text(encoding="utf-8"))
          report = data["playable_ab"]
          assert report["comparison"]["same_world_inputs"] is True
          assert report["first_divergence"] is not None
          assert report["vanilla"]["metrics"]
          assert report["causal"]["metrics"]
          examples = data["examples"]
          assert set(examples) == {"hvac", "temporal", "open_world"}
          assert all(run["episode_ledger"] for run in examples.values())
          assert any(
              (row.get("hypothesis_changes") or {}).get("structural_change")
              for row in examples["open_world"]["episode_ledger"]
          )
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
