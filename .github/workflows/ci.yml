name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Assert heavy retrieval and OTel SDK stacks are absent
        run: |
          python - <<'PY'
          import importlib.util as i

          def absent(name):
              try:
                  return i.find_spec(name) is None
              except ModuleNotFoundError:
                  return True

          assert absent('sentence_transformers')
          assert absent('faiss')
          assert absent('torch')
          assert absent('opentelemetry.sdk')
          PY
      - name: Compile runtime
        run: |
          python -m py_compile branchpoint/__init__.py branchpoint/authorization.py branchpoint/execution.py branchpoint/postgres_execution.py branchpoint/integrations/openai_agents.py branchpoint/decision.py branchpoint/decision_io.py branchpoint/cli.py branchpoint/agent/temporal.py branchpoint/environments/boptest.py branchpoint/observability/telemetry.py branchpoint/benchmarks/temporal_hidden_world.py branchpoint/benchmarks/temporal_suite.py branchpoint/benchmarks/boptest_protocol.py branchpoint/benchmarks/boptest_comparison.py branchpoint/benchmarks/boptest_branchpoint.py branchpoint/benchmarks/boptest_study.py examples/hypothesis_falsification_demo.py examples/bayesian_experiment_demo.py examples/decision_preferences_demo.py examples/hidden_world_demo.py examples/hidden_world_suite_demo.py examples/hidden_world_policy_comparison.py examples/hidden_world_risk_sweep.py examples/temporal_hidden_world_demo.py examples/temporal_suite_demo.py examples/open_world_mismatch_demo.py examples/browser_action_guard_demo.py examples/production_execution_boundary.py examples/tool_routing_demo.py examples/incident_triage_demo.py examples/custom_capability_pack.py examples/boptest_live_smoke.py examples/boptest_protocol_run.py examples/boptest_branchpoint_vs_proposer.py examples/boptest_branchpoint_regime_study.py examples/openai_agents_durable_tool.py scripts/build_release_evidence.py
          python -m compileall -q branchpoint/agent branchpoint/world_model branchpoint/reasoning branchpoint/experiments branchpoint/environments branchpoint/observability branchpoint/benchmarks branchpoint/tools branchpoint/generator branchpoint/utils
      - name: Core import and CLI smoke
        run: |
          python -c "import branchpoint; assert branchpoint.__version__ == '0.3.0'; from branchpoint import CausalAgent, CausalTelemetry, DecisionPreferences, ExecutionLedger, PostgresExecutionLedger, Hypothesis, ExperimentContract, ModelMismatchPolicy, TemporalEffectContract, VirtualTimeDriver, arbitrate_payload, create_agent, decide; from branchpoint.environments import BOPTESTClient; from branchpoint.experiments import InterventionContract, experiment_decision_value; from branchpoint.benchmarks import DecisionValuePolicy, compare_hidden_world_policies, compare_risk_sensitivity, compare_temporal_guard, compare_temporal_suite; print(branchpoint.__version__)"
          branchpoint --version
          branchpoint --help
      - name: Agent, causal trace, hypothesis, open-world, environment, temporal, decision, benchmark, policy and CLI tests
        run: pytest -q tests/test_brand_surface.py tests/test_release_version.py tests/test_release_evidence.py tests/test_cli_doctor.py tests/test_decide.py tests/test_decision_payload.py tests/test_cli_packs.py tests/test_scaffold.py tests/test_agent_loop.py tests/test_agent_reasoning.py tests/test_observability.py tests/test_hypothesis_falsification.py tests/test_discrimination_policy.py tests/test_experiment_contracts.py tests/test_open_world_mismatch.py tests/test_llm_open_world_discovery.py tests/test_boptest_client.py tests/test_boptest_protocol.py tests/test_boptest_comparison.py tests/test_boptest_statistics.py tests/test_boptest_branchpoint.py tests/test_boptest_study.py tests/test_decision_value.py tests/test_decision_preferences.py tests/test_temporal_runtime.py tests/test_temporal_hidden_world.py tests/test_temporal_attribution_guard.py tests/test_temporal_suite.py tests/test_hidden_world.py tests/test_hidden_world_stochastic.py tests/test_hidden_world_policy_comparison.py tests/test_llm_interface.py tests/test_user_quickstart.py tests/test_cli_embedding_options.py tests/test_jev_bridge.py tests/test_execution_boundary.py tests/test_authorization.py tests/test_openai_agents_approval.py tests/test_production_boundary.py
      - name: Run no-key falsification demo
        run: python examples/hypothesis_falsification_demo.py
      - name: Run no-key Bayesian experiment demo
        run: python examples/bayesian_experiment_demo.py
      - name: Run no-key open-world mismatch demo
        run: python examples/open_world_mismatch_demo.py
      - name: Run deployment decision preferences demo
        run: python examples/decision_preferences_demo.py
      - name: Run one-shot browser decision demo
        run: python examples/browser_action_guard_demo.py
      - name: Run composed production boundary reference
        run: python examples/production_execution_boundary.py
      - name: Run capability routing demo
        run: python examples/tool_routing_demo.py
      - name: Run incident triage demo
        run: python examples/incident_triage_demo.py
      - name: Run external capability-pack demo
        run: python examples/custom_capability_pack.py
      - name: List capability packs
        run: branchpoint packs --json
      - name: Run portable Bayesian EVSI decision
        run: |
          branchpoint decide examples/value_of_information.json --json > /tmp/evsi.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/evsi.json").read_text())
          assert result["selected"]["name"] == "diagnose"
          assert result["ranking"][0]["score"]["information_source"] == "runtime_bayesian_eig"
          assert result["ranking"][0]["score"]["decision_value_source"] == "runtime_expected_decision_value_after_sampling"
          PY
      - name: Scaffold and load a capability pack
        run: |
          branchpoint scaffold examples/value_of_information.json --pack-id evsi_generated --output /tmp/evsi_generated.py
          branchpoint packs --load-pack /tmp/evsi_generated.py:register_pack --json > /tmp/packs.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("/tmp/packs.json").read_text())
          assert "evsi_generated" in {row["id"] for row in rows}
          PY
      - name: Run no-key HiddenWorld benchmark demo
        run: python examples/hidden_world_demo.py
      - name: Run seeded stochastic HiddenWorld suite
        run: python examples/hidden_world_suite_demo.py
      - name: Compare HiddenWorld reference policies
        run: python examples/hidden_world_policy_comparison.py
      - name: Sweep HiddenWorld wrong-action utility
        run: python examples/hidden_world_risk_sweep.py
      - name: Compare naive versus temporal delayed-effect behavior
        run: python examples/temporal_hidden_world_demo.py
      - name: Run temporal causality failure-mode suite
        run: python examples/temporal_suite_demo.py

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install observability layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[observability,dev]"
      - name: Import OpenTelemetry integration
        run: |
          python -c "import opentelemetry.sdk; from branchpoint import CausalTelemetry, configure_otlp_telemetry; t=CausalTelemetry(enable_otel=True); print('otel causal telemetry available', bool(t))"
      - name: Run causal trace tests with OTel installed
        run: pytest -q tests/test_observability.py

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Import API
        run: |
          python -c "from branchpoint.interface.agent_api import app, health; assert health()['status'] == 'healthy'; assert app.version == '0.3.0'; print(app.title, app.version)"
      - name: API embedding configuration test
        run: pytest -q tests/test_api_embedding_options.py

  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight retrieval layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[retrieval,dev]"
      - name: Assert local ML stack is opt-in
        run: |
          python -c "import importlib.util as i; assert i.find_spec('sentence_transformers') is None; assert i.find_spec('faiss') is None; assert i.find_spec('torch') is None"
      - name: Compile and import retrieval
        run: |
          python -m compileall -q branchpoint/embeddings branchpoint/causal_graph branchpoint/retriever branchpoint/reranker branchpoint/pipeline.py
          python -c "from branchpoint import create_pipeline; from branchpoint.embeddings import OpenAIEmbeddingProvider; print('lightweight retrieval surface available')"
      - name: Embedding and retrieval tests
        run: pytest -q tests/test_embedding_providers.py

  postgres-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: branchpoint
          POSTGRES_PASSWORD: branchpoint
          POSTGRES_DB: branchpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U branchpoint -d branchpoint"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      BRANCHPOINT_TEST_POSTGRES_DSN: postgresql://branchpoint:branchpoint@127.0.0.1:5432/branchpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL execution backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres,dev]"
      - name: Run distributed execution-ledger contract
        run: pytest -q tests/test_postgres_execution_ledger.py

  openai-agents-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tested OpenAI Agents integration
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[openai-agents,dev]"
      - name: Verify Branchpoint policy and SDK compatibility
        run: |
          pytest -q \
            tests/test_openai_agents_approval.py \
            tests/test_openai_agents_sdk_compat.py
      - name: Run durable SDK tool example
        run: |
          python examples/openai_agents_durable_tool.py > /tmp/openai-agents-durable.txt
          cat /tmp/openai-agents-durable.txt
          grep -q "external_calls: 1" /tmp/openai-agents-durable.txt
          grep -q "receipt_status: succeeded" /tmp/openai-agents-durable.txt
          grep -q "first_replayed: False" /tmp/openai-agents-durable.txt
          grep -q "replay_replayed: True" /tmp/openai-agents-durable.txt
