name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Assert heavy RAG stack is absent
        run: |
          python -c "import importlib.util as i; assert i.find_spec('sentence_transformers') is None; assert i.find_spec('faiss') is None; assert i.find_spec('torch') is None"
      - name: Compile runtime
        run: |
          python -m py_compile causalrag/__init__.py causalrag/cli.py examples/hypothesis_falsification_demo.py
          python -m compileall -q causalrag/agent causalrag/world_model causalrag/reasoning causalrag/tools causalrag/generator causalrag/utils
      - name: Core import and CLI smoke
        run: |
          python -c "import causalrag; from causalrag import CausalAgent, Hypothesis, create_agent; print(causalrag.__version__)"
          causalrag --version
          causalrag --help
      - name: Agent, hypothesis, policy and CLI tests
        run: pytest -q tests/test_agent_loop.py tests/test_agent_reasoning.py tests/test_hypothesis_falsification.py tests/test_discrimination_policy.py tests/test_llm_interface.py tests/test_user_quickstart.py tests/test_cli_embedding_options.py
      - name: Run no-key falsification demo
        run: python examples/hypothesis_falsification_demo.py

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Import API
        run: |
          python -c "from causalrag.interface.agent_api import app, health; assert health()['status'] == 'healthy'; print(app.title)"
      - name: API embedding configuration test
        run: pytest -q tests/test_api_embedding_options.py

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight RAG layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag,dev]"
      - name: Assert local ML stack is opt-in
        run: |
          python -c "import importlib.util as i; assert i.find_spec('sentence_transformers') is None; assert i.find_spec('faiss') is None; assert i.find_spec('torch') is None"
      - name: Compile and import RAG
        run: |
          python -m compileall -q causalrag/embeddings causalrag/causal_graph causalrag/retriever causalrag/reranker causalrag/pipeline.py
          python -c "from causalrag import create_pipeline; from causalrag.embeddings import OpenAIEmbeddingProvider; print('lightweight rag surface available')"
      - name: Embedding and retrieval tests
        run: pytest -q tests/test_embedding_providers.py
