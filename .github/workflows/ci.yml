name: ci

on:
  push:
    branches: [main, feature/causal-agent-v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile top-level runtime
        run: python -m py_compile causalrag/__init__.py causalrag/pipeline.py causalrag/cli.py
      - name: Compile agent
        run: python -m compileall -q causalrag/agent
      - name: Compile world model
        run: python -m compileall -q causalrag/world_model
      - name: Compile reasoning
        run: python -m compileall -q causalrag/reasoning
      - name: Compile tools
        run: python -m compileall -q causalrag/tools
      - name: Compile causal graph
        run: python -m compileall -q causalrag/causal_graph
      - name: Compile retrievers
        run: python -m compileall -q causalrag/retriever causalrag/reranker
      - name: Compile generator evaluation interface utils
        run: python -m compileall -q causalrag/generator causalrag/evaluation causalrag/interface causalrag/utils
      - name: Import smoke
        run: |
          python -c "import causalrag; from causalrag import CausalAgent, create_agent; print(causalrag.__version__)"
          causalrag --version
          causalrag --help
      - name: Agent tests
        run: pytest -q tests/test_agent_loop.py tests/test_agent_reasoning.py
