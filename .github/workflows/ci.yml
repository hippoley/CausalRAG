name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Assert heavy RAG stack is absent
        run: |
          python -c "import importlib.util as i; assert i.find_spec('sentence_transformers') is None; assert i.find_spec('faiss') is None; assert i.find_spec('torch') is None"
      - name: Compile runtime
        run: |
          python -m py_compile causalrag/__init__.py causalrag/cli.py causalrag/agent/capabilities.py causalrag/agent/temporal.py causalrag/environments/boptest.py causalrag/benchmarks/ablation.py causalrag/benchmarks/temporal_hidden_world.py causalrag/benchmarks/temporal_suite.py examples/hypothesis_falsification_demo.py examples/bayesian_experiment_demo.py examples/decision_preferences_demo.py examples/hidden_world_demo.py examples/hidden_world_suite_demo.py examples/hidden_world_policy_comparison.py examples/hidden_world_risk_sweep.py examples/temporal_hidden_world_demo.py examples/temporal_suite_demo.py examples/open_world_mismatch_demo.py examples/boptest_live_smoke.py
          python -m compileall -q causalrag/agent causalrag/world_model causalrag/reasoning causalrag/experiments causalrag/environments causalrag/benchmarks causalrag/tools causalrag/generator causalrag/utils
      - name: Core import and CLI smoke
        run: |
          python -c "import causalrag; assert causalrag.__version__ == '0.3.0'; from causalrag.agent import RuntimeCapabilities; from causalrag import CausalAgent, DecisionPreferences, Hypothesis, ExperimentContract, ModelMismatchPolicy, TemporalEffectContract, VirtualTimeDriver, create_agent; from causalrag.environments import BOPTESTClient; from causalrag.experiments import InterventionContract, experiment_decision_value; from causalrag.benchmarks import AblationArm, ScenarioManifest, DecisionValuePolicy, compare_hidden_world_policies, compare_risk_sensitivity, compare_temporal_guard, compare_temporal_suite; print(causalrag.__version__)"
          causalrag --version
          causalrag --help
      - name: Agent, ablation, hypothesis, open-world, environment, temporal, decision, benchmark, policy and CLI tests
        run: pytest -q tests/test_release_version.py tests/test_agent_loop.py tests/test_agent_reasoning.py tests/test_runtime_ablation.py tests/test_hypothesis_falsification.py tests/test_discrimination_policy.py tests/test_experiment_contracts.py tests/test_open_world_mismatch.py tests/test_llm_open_world_discovery.py tests/test_boptest_client.py tests/test_decision_value.py tests/test_decision_preferences.py tests/test_temporal_runtime.py tests/test_temporal_hidden_world.py tests/test_temporal_attribution_guard.py tests/test_temporal_suite.py tests/test_hidden_world.py tests/test_hidden_world_stochastic.py tests/test_hidden_world_policy_comparison.py tests/test_llm_interface.py tests/test_user_quickstart.py tests/test_cli_embedding_options.py
      - name: Run no-key falsification demo
        run: python examples/hypothesis_falsification_demo.py
      - name: Run no-key Bayesian experiment demo
        run: python examples/bayesian_experiment_demo.py
      - name: Run no-key open-world mismatch demo
        run: python examples/open_world_mismatch_demo.py
      - name: Run deployment decision preferences demo
        run: python examples/decision_preferences_demo.py
      - name: Run no-key HiddenWorld benchmark demo
        run: python examples/hidden_world_demo.py
      - name: Run seeded stochastic HiddenWorld suite
        run: python examples/hidden_world_suite_demo.py
      - name: Compare HiddenWorld reference policies
        run: python examples/hidden_world_policy_comparison.py
      - name: Sweep HiddenWorld wrong-action utility
        run: python examples/hidden_world_risk_sweep.py
      - name: Compare naive versus temporal delayed-effect behavior
        run: python examples/temporal_hidden_world_demo.py
      - name: Run temporal causality failure-mode suite
        run: python examples/temporal_suite_demo.py

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Import API
        run: |
          python -c "from causalrag.interface.agent_api import app, health; assert health()['status'] == 'healthy'; assert app.version == '0.3.0'; print(app.title, app.version)"
      - name: API embedding configuration test
        run: pytest -q tests/test_api_embedding_options.py

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight RAG layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag,dev]"
      - name: Assert local ML stack is opt-in
        run: |
          python -c "import importlib.util as i; assert i.find_spec('sentence_transformers') is None; assert i.find_spec('faiss') is None; assert i.find_spec('torch') is None"
      - name: Compile and import RAG
        run: |
          python -m compileall -q causalrag/embeddings causalrag/causal_graph causalrag/retriever causalrag/reranker causalrag/pipeline.py
          python -c "from causalrag import create_pipeline; from causalrag.embeddings import OpenAIEmbeddingProvider; print('lightweight rag surface available')"
      - name: Embedding and retrieval tests
        run: pytest -q tests/test_embedding_providers.py
