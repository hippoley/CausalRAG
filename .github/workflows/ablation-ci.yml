name: ablation-ci

on:
  pull_request:
    paths:
      - "branchpoint/agent/**"
      - "branchpoint/reasoning/policy.py"
      - "branchpoint/benchmarks/ablation.py"
      - "tests/test_runtime_ablation.py"
      - ".github/workflows/ablation-ci.yml"

jobs:
  execution-ablation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test layer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile ablation runtime
        run: |
          python -m py_compile branchpoint/agent/ablation.py branchpoint/agent/capabilities.py branchpoint/agent/loop.py branchpoint/reasoning/policy.py branchpoint/benchmarks/ablation.py
      - name: Verify execution-level ablations and paired experiment schema
        run: pytest -q tests/test_runtime_ablation.py
      - name: Verify observability remains compatible
        run: pytest -q tests/test_observability.py
