<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CausalRAG · Examples</title>
<style>
:root{--bg:#f4f2eb;--paper:#fffef9;--ink:#15201d;--muted:#6d7773;--line:#d9d8cf;--green:#173f34;--mint:#d9f5e9;--amber:#ffe8bb;--blue:#e8f1ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#f4f2ebed;z-index:4}.top a{color:inherit;text-decoration:none}.brand{font-weight:850}.mono{font:10px ui-monospace,monospace;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:44px 24px 80px}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:.12em;color:#567067}.hero{max-width:850px}.hero h1{font-size:54px;line-height:.98;letter-spacing:-.055em;margin:8px 0 13px}.hero p{font-size:17px;color:var(--muted);max-width:750px}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.case{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:20px;cursor:pointer;text-align:left;transition:.16s}.case:hover,.case.active{transform:translateY(-1px);border-color:#6b8a80}.case.active{box-shadow:0 0 0 2px #dcece5 inset}.case .n{font:10px ui-monospace,monospace;color:var(--muted)}.case h2{font-size:22px;line-height:1.1;letter-spacing:-.03em;margin:15px 0 7px}.case p{margin:0;color:var(--muted);font-size:13px}.case .lesson{margin-top:20px;padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:#385149}
.runbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:15px 0}.runbar p{margin:0;color:var(--muted);font-size:12px}.btn{border:0;border-radius:11px;background:var(--green);color:white;padding:11px 15px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}
.story{display:none;border:1px solid var(--line);background:var(--paper);border-radius:22px;overflow:hidden}.story.on{display:block}.story-head{padding:21px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:end}.story-head h2{font-size:27px;margin:3px 0 0;letter-spacing:-.03em}.story-head p{margin:0;color:var(--muted);font-size:12px;max-width:520px}.summary{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.metric{padding:14px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric span,.metric b{display:block}.metric span{font:9px ui-monospace,monospace;color:var(--muted)}.metric b{font-size:18px;margin-top:5px}
.timeline{padding:24px}.step{display:grid;grid-template-columns:90px 1fr;gap:17px;padding-bottom:22px;position:relative}.step:before{content:"";position:absolute;left:78px;top:10px;bottom:-3px;width:1px;background:#d7d9d4}.step:last-child:before{display:none}.dot{position:absolute;left:73px;top:6px;width:11px;height:11px;border-radius:99px;background:var(--green);box-shadow:0 0 0 4px var(--paper)}.label{text-align:right;color:var(--muted);font:9px ui-monospace,monospace;padding-top:1px}.content h3{margin:0 0 4px;font-size:17px}.content p{margin:0;color:var(--muted)}.belief-shift{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{padding:4px 7px;border-radius:8px;background:#eff2ee;font:10px ui-monospace,monospace}.chip.up{background:var(--mint)}.chip.guard{background:var(--amber)}.chip.open{background:var(--blue)}
.takeaway{margin:0 24px 24px;padding:16px 18px;border-radius:15px;background:var(--mint)}.takeaway b{display:block;margin-bottom:4px}.error{color:#934047;font-size:12px}
@media(max-width:850px){.cases{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.hero h1{font-size:42px}}@media(max-width:560px){.story-head,.runbar{align-items:flex-start;flex-direction:column}.step{grid-template-columns:62px 1fr}.step:before{left:52px}.dot{left:47px}}
</style></head><body>
<header class="top"><a class="brand" href="/">CausalRAG <span class="mono">EXAMPLES</span></a><a href="/workbench">Open Live Workbench →</a></header>
<main>
<section class="hero"><div class="eyebrow">THREE THINGS ORDINARY AGENTS GET WRONG</div><h1>不要一次理解全部。<br>一次只体验一个精髓。</h1><p>三个案例分别展示 CausalRAG 的三个核心能力：信息价值、时间归因、以及“模型里根本没有正确答案”时的开放世界修正。每个案例都调用真实 Python runtime。</p></section>
<section class="cases">
<button class="case active" data-case="hvac"><span class="n">01 · INFORMATION VALUE</span><h2>哪个实验最值得先做？</h2><p>三个原因都说得通，但 probe budget 有限。Agent 不能“都查一遍”。</p><div class="lesson">体验：Bayesian learning / EIG / EVSI</div></button>
<button class="case" data-case="temporal"><span class="n">02 · TEMPORAL CAUSALITY</span><h2>什么时候读数才算证据？</h2><p>阀门刚打开就读取，会得到一个“真的数值”，但它可能不是合法因果证据。</p><div class="lesson">体验：temporal guard / attribution</div></button>
<button class="case" data-case="open"><span class="n">03 · OPEN WORLD</span><h2>如果正确答案根本不在模型里？</h2><p>所有已有 H1/H2 都解释不了 observation。好的 agent 必须敢承认模型错了。</p><div class="lesson">体验：model mismatch / hypothesis discovery</div></button>
</section>
<div class="runbar"><p id="caseHint">先看它如何在有限 probe budget 下选择最有价值的实验。</p><button class="btn" id="runBtn">运行这个真实案例 →</button></div>
<div id="err" class="error"></div>
<section class="story" id="story">
  <div class="story-head"><div><div class="eyebrow">REAL RUNTIME TRAJECTORY</div><h2 id="storyTitle">—</h2></div><p id="storySub">—</p></div>
  <div class="summary"><div class="metric"><span>RESULT</span><b id="mResult">—</b></div><div class="metric"><span>DECISIONS</span><b id="mDecisions">—</b></div><div class="metric"><span>PROBABILITY</span><b id="mPosterior">—</b></div><div class="metric"><span>TRACE</span><b id="mTrace">—</b></div></div>
  <div class="timeline" id="timeline"></div>
  <div class="takeaway"><b id="takeawayTitle">—</b><span id="takeawayText">—</span></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let active='hvac';
const specs={
 hvac:{scenario:'hvac_hidden_world',hidden_hypothesis:'H2',outcome_mode:'deterministic',title:'有限预算下，先买哪条证据？',sub:'真实 runtime 会在多个 diagnostic action 之间做 arbitration，而不是按模型输出顺序照单全收。',hint:'先看它如何在有限 probe budget 下选择最有价值的实验。',take:'这里的精髓不是“会调工具”，而是把下一步当成一个决策问题：哪条 evidence 最可能改变最终 action。'},
 temporal:{scenario:'temporal_delayed_effect',hidden_hypothesis:'H1',outcome_mode:'deterministic',title:'真实数值，也可能不是合法证据。',sub:'intervention 后必须等 causal window 打开；过早 read 会被 temporal attribution 拒绝。',hint:'重点看它为什么会先 WAIT，而不是立刻读一个看似真实的数。',take:'CausalRAG 不只判断“观测是什么”，还判断“它是不是由刚才那个 action 造成的”。'},
 open:{scenario:'open_world_mismatch',hidden_hypothesis:'H4',outcome_mode:'deterministic',title:'Agent 发现：正确原因不在原来的模型里。',sub:'连续 observation 在 H1/H2 下都极不可能，runtime 触发 model mismatch，并允许发现 H4。',hint:'重点看已有假设都解释失败后，Agent 是否会创建并验证一个新机制。',take:'自精化最关键的一步不是把 H1/H2 权重调得更漂亮，而是承认 hypothesis class 本身不完整，并长出 H4。'}
};
document.querySelectorAll('.case').forEach(b=>b.onclick=()=>{active=b.dataset.case;document.querySelectorAll('.case').forEach(x=>x.classList.toggle('active',x===b));$('caseHint').textContent=specs[active].hint});
function shiftHTML(row){const d=row.posterior_delta||{};const chips=Object.entries(d).filter(([,v])=>Math.abs(Number(v))>.001).sort((a,b)=>Math.abs(Number(b[1]))-Math.abs(Number(a[1]))).slice(0,3);return chips.length?'<div class="belief-shift">'+chips.map(([id,v])=>'<span class="chip '+(Number(v)>0?'up':'')+'">'+esc(id)+' '+(Number(v)>=0?'+':'')+(100*Number(v)).toFixed(1)+'pp</span>').join('')+'</div>':''}
function step(label,title,text,chips=''){return '<div class="step"><div class="label">'+esc(label)+'</div><i class="dot"></i><div class="content"><h3>'+esc(title)+'</h3><p>'+text+'</p>'+chips+'</div></div>'}
async function run(){const s=specs[active],btn=$('runBtn');btn.disabled=true;$('err').textContent='';try{const r=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scenario:s.scenario,hidden_hypothesis:s.hidden_hypothesis,outcome_mode:s.outcome_mode,proposer_family:'deterministic',max_steps:6,max_probes:3,seed:0})});const d=await r.json();if(!r.ok)throw new Error(d.detail||JSON.stringify(d));$('storyTitle').textContent=s.title;$('storySub').textContent=s.sub;const m=d.metrics||{};$('mResult').textContent=m.success===true?'SUCCESS':m.success===false?'NOT YET':'DONE';$('mDecisions').textContent=(d.decisions||[]).length;$('mPosterior').textContent=Math.round(100*Number(m.true_hypothesis_posterior||0))+'%';$('mTrace').textContent=String(d.trace_id||'—').slice(0,8);let h=step('START','先建立竞争解释','Agent 不是从一个答案开始，而是从可被推翻的 hypotheses 开始。');(d.episode_ledger||[]).forEach((row,i)=>{const sel=row.selected||{},obs=row.observation||{},ins=row.decision_inspector||{};let chips='';if(ins.diverged)chips+='<div class="belief-shift"><span class="chip guard">runtime changed proposer choice</span></div>';chips+=shiftHTML(row);h+=step('STEP '+(i+1),(sel.kind||'action')+' · '+(sel.name||'—'),esc(JSON.stringify(obs.result??obs).slice(0,230)),chips)});if(active==='open'&&m.discovered_hypothesis)h+=step('MODEL UPDATE','新的 H4 被发现并进入 world model','原来的 H1/H2 hypothesis class 被现实证据判定为不完整。','<div class="belief-shift"><span class="chip open">new hypothesis H4</span></div>');h+=step('END','Agent 停止继续采样','最终结论与停止条件来自整条 trajectory，而不是单次模型回答。');$('timeline').innerHTML=h;$('takeawayTitle').textContent='你刚刚体验到的不是普通 tool calling';$('takeawayText').textContent=s.take;$('story').classList.add('on');$('story').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){$('err').textContent='Run failed: '+e.message}finally{btn.disabled=false}}
$('runBtn').onclick=run;
</script></body></html>
