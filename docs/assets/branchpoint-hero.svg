<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Branchpoint</title>
<desc id="desc">A state enters a decision point, branches into possible actions, and one branch returns world evidence to update state.</desc>
<rect width="1200" height="420" rx="32" fill="#081211"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M92 210 H330" stroke="#49605A" stroke-width="3"/>
  <path d="M330 210 C455 210 455 84 590 84 H866" stroke="#36514A" stroke-width="3"/>
  <path d="M330 210 H866" stroke="#78F0BE" stroke-width="5"/>
  <path d="M330 210 C455 210 455 336 590 336 H866" stroke="#36514A" stroke-width="3"/>
  <path d="M866 210 C990 210 1012 282 1012 326 C1012 368 955 382 888 382 H254 C170 382 132 334 132 288" stroke="#2F7660" stroke-width="3" stroke-dasharray="8 10"/>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <circle cx="92" cy="210" r="10" fill="#A9BBB5"/>
  <text x="74" y="184" fill="#839992" font-size="14">STATE</text>

  <circle cx="330" cy="210" r="16" fill="#78F0BE"/>
  <circle cx="330" cy="210" r="5" fill="#081211"/>
  <text x="272" y="168" fill="#D9E7E2" font-size="14">BRANCHPOINT</text>

  <circle cx="866" cy="84" r="9" fill="#5C736C"/>
  <text x="892" y="89" fill="#7E938D" font-size="14">WAIT</text>

  <circle cx="866" cy="210" r="11" fill="#78F0BE"/>
  <text x="892" y="215" fill="#D9E7E2" font-size="14">VERIFY</text>

  <circle cx="866" cy="336" r="9" fill="#5C736C"/>
  <text x="892" y="341" fill="#7E938D" font-size="14">ACT</text>

  <text x="96" y="370" fill="#5F7770" font-size="13">WORLD EVIDENCE UPDATES THE NEXT STATE</text>
</g>
<g font-family="Inter,Arial,sans-serif">
  <text x="92" y="72" fill="#F0F7F4" font-size="42" font-weight="700" letter-spacing="-1.5">State in. Decisions out.</text>
  <text x="92" y="116" fill="#78F0BE" font-size="42" font-weight="700" letter-spacing="-1.5">The world gets a vote.</text>
</g>
</svg>