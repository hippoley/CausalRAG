<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Branchpoint</title>
<desc id="desc">A same-world split showing a model proposal crossing directly into failure versus Branchpoint verifying world state before execution.</desc>
<rect width="1200" height="520" rx="34" fill="#050607"/>
<rect x="30" y="30" width="1140" height="460" rx="28" fill="#0a0c0e" stroke="#1b211f"/>
<circle cx="76" cy="72" r="7" fill="#b7ff5d"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="96" y="80" fill="#f4f7f5" font-size="18" font-weight="800" letter-spacing="2">BRANCHPOINT</text>
  <text x="72" y="154" fill="#f4f7f5" font-size="44" font-weight="800" letter-spacing="-1.8">MODEL INTENT ≠ EXECUTION AUTHORITY</text>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <rect x="72" y="206" width="1056" height="64" rx="16" fill="#101413" stroke="#202724"/>
  <text x="94" y="232" fill="#6d7772" font-size="12">MODEL PROPOSAL</text>
  <text x="94" y="255" fill="#dfe7e3" font-size="17">submit_form</text>

  <text x="72" y="316" fill="#7c8580" font-size="12" letter-spacing="1">NAIVE LOOP</text>
  <rect x="72" y="334" width="438" height="92" rx="16" fill="#0e1011" stroke="#2a2020"/>
  <text x="94" y="365" fill="#dfe7e3" font-size="16">submit_form → session_expired</text>
  <text x="94" y="398" fill="#ff6b6b" font-size="15">FAIL</text>

  <text x="602" y="316" fill="#7c8580" font-size="12" letter-spacing="1">BRANCHPOINT</text>
  <rect x="602" y="334" width="526" height="92" rx="16" fill="#0a120d" stroke="#243a2c"/>
  <text x="624" y="365" fill="#dfe7e3" font-size="16">inspect → reauthenticate → submit</text>
  <text x="624" y="398" fill="#78f0be" font-size="15">SUCCESS</text>

  <text x="72" y="462" fill="#59625e" font-size="13">same world · same model · first divergence step 0 · CI-generated receipt</text>
</g>
<path d="M538 381 L574 381" stroke="#b7ff5d" stroke-width="3"/>
<path d="M564 371 L575 381 L564 391" fill="none" stroke="#b7ff5d" stroke-width="3"/>
</svg>