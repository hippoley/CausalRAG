<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Branchpoint</title>
<desc id="desc">The control layer between model intent and real-world side effects.</desc>
<rect width="1200" height="630" fill="#050607"/>
<rect x="54" y="54" width="1092" height="522" rx="34" fill="#0a0c0e" stroke="#1b211f"/>
<circle cx="96" cy="105" r="7" fill="#b7ff5d"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="118" y="113" fill="#f4f7f5" font-size="20" font-weight="800" letter-spacing="2">BRANCHPOINT</text>
  <text x="96" y="208" fill="#f4f7f5" font-size="64" font-weight="820" letter-spacing="-3">THE MODEL SAID SUBMIT.</text>
  <text x="96" y="278" fill="#aab3af" font-size="64" font-weight="820" letter-spacing="-3">THE WORLD SAID NO.</text>
  <text x="96" y="354" fill="#b7ff5d" font-size="26" font-weight="700">MODEL INTENT ≠ EXECUTION AUTHORITY</text>
</g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="17">
  <text x="96" y="444" fill="#7c8580">NAIVE LOOP</text>
  <text x="96" y="478" fill="#ff6b6b">submit_form → session_expired → FAIL</text>
  <text x="650" y="444" fill="#7c8580">BRANCHPOINT</text>
  <text x="650" y="478" fill="#78f0be">inspect → reauthenticate → SUCCESS</text>
  <text x="96" y="540" fill="#59625e">hippoley / same world · same model · first divergence step 0</text>
</g>
<path d="M577 424 L611 424" stroke="#b7ff5d" stroke-width="3"/>
<path d="M601 414 L612 424 L601 434" fill="none" stroke="#b7ff5d" stroke-width="3"/>
</svg>